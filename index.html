<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obey Kinchi Trading Bot</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#121212;
      color:white;
      text-align:center;
    }
    header{
      background:#00b894;
      padding:20px;
      font-size:28px;
      font-weight:bold;
    }
    .card{
      margin:20px;
      padding:20px;
      background:#1e1e1e;
      border-radius:12px;
    }
    button{
      background:#00b894;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
      margin:5px;
    }
    input{
      width:90%;
      padding:10px;
      margin:10px;
      border-radius:8px;
      border:none;
    }
  </style>
</head>
<body>

<header>🤖 Obey Kinchi Trading Bot</header>

<div class="card">
  <h2>Welcome</h2>
  <p>Connect your Deriv API Token to begin.</p>

  <input type="password" placeholder="Enter Deriv API Token">

  <br>

  <button>Connect</button>
  <button>Start Bot</button>
  <button>Stop Bot</button>
</div>

<div class="card">
  <h3>Account Balance</h3>
  <p>$0.00</p>
</div>

<div class="card">
  <h3>Status</h3>
  <p>Disconnected</p>
</div>

</body>
</html>
