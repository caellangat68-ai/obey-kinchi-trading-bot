<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f19">
  <title>OBEY KINCHI TRADING BOT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    header {
      text-align: center;
      padding: 20px 10px;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    header p {
      color: #9ca3af;
      font-size: 14px;
    }

    .card {
      background: #121827;
      border: 1px solid #252d3d;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 14px;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #1b2232;
      color: #facc15;
      text-align: center;
      margin-bottom: 14px;
      font-weight: bold;
    }

    .balance-box {
      text-align: center;
      padding: 18px;
      background: #0f1522;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .balance-label {
      color: #9ca3af;
      font-size: 13px;
    }

    .balance {
      font-size: 30px;
      font-weight: bold;
      margin-top: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 9px;
      border: 1px solid #30394d;
      background: #0b0f19;
      color: #ffffff;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }

    .connect-btn {
      background: #2563eb;
      color: white;
    }

    .start-btn {
      background: #16a34a;
      color: white;
    }

    .stop-btn {
      background: #dc2626;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    .market-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .market {
      background: #1a2232;
      border: 1px solid #30394d;
      padding: 14px 8px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
    }

    .market.active {
      border-color: #38bdf8;
      background: #10283a;
    }

    .strategy {
      border: 1px solid #30394d;
      background: #0f1522;
      padding: 16px;
      border-radius: 12px;
    }

    .strategy h3 {
      margin-bottom: 8px;
    }

    .strategy p {
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.5;
    }

    .
